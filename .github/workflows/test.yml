name: Run Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          sed -i "s/^MetaTrader5/#MetaTrader5/g" requirements.txt && pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-xdist httpx pyarrow pandas fastapi asyncpg uvicorn

      - name: Run pytest
        run: |
          pytest tests/ test_google_timesfm_model.py test_dev_parallel_check.py test_omni_route.py test_conftest.py test_extract_nas100_raw.py
